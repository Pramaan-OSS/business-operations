name: Set up business operations
description: Install the locked workspace dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .node-version
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: .bun-version
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version', 'bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile --ignore-scripts
    - name: Prepare test output directories
      shell: bash
      run: mkdir -p .scratch/ci
