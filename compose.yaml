name: business-operations
services:
  database:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD}
      POSTGRES_DB: business_operations
    ports: ["127.0.0.1:${LOCAL_DATABASE_PORT:-55438}:5432"]
    volumes:
      - database:/var/lib/postgresql
      - ./scripts/local/database.sql:/docker-entrypoint-initdb.d/10-local.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d business_operations"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  auth:
    image: public.ecr.aws/supabase/gotrue:v2.191.0
    depends_on:
      database: { condition: service_healthy }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      GOTRUE_SITE_URL: ${NEXT_PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${NEXT_PUBLIC_URL}/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${LOCAL_DATABASE_PASSWORD}@database:5432/business_operations?search_path=auth
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SECURITY_MIN_PASSWORD_LENGTH: 12
      GOTRUE_MFA_ENABLED: "true"
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_DISABLE_SIGNUP: "false"
  rest:
    image: postgrest/postgrest:v14.12
    depends_on:
      database: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://postgres:${LOCAL_DATABASE_PASSWORD}@database:5432/business_operations
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    depends_on:
      database: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth: { condition: service_started }
      rest: { condition: service_started }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PRIMARY_URL: postgres://postgres:${LOCAL_DATABASE_PASSWORD}@database:5432/business_operations
      DATABASE_PRIMARY_POOLER_URL: postgres://postgres:${LOCAL_DATABASE_PASSWORD}@database:5432/business_operations
      DATABASE_SSL: "false"
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      API_INTERNAL_URL: http://localhost:3002
      BUSINESS_OPERATIONS_DASHBOARD_URL: ${NEXT_PUBLIC_URL}
      BUSINESS_OPERATIONS_API_URL: ${NEXT_PUBLIC_API_URL}
      STORAGE_ROOT: /workspace/.data/storage
      ALLOWED_API_ORIGINS: ${NEXT_PUBLIC_URL}
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:3001:3001", "127.0.0.1:3002:3002", "127.0.0.1:65431:65431"]
    volumes: ["files:/workspace/.data"]
volumes:
  database:
  redis:
  files:
